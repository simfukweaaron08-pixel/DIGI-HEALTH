{% extends 'base.html' %}

{% block title %}Password Reset Sent{% endblock %}

{% block content %}
<div class="page">
  <section class="form-panel">
    <header class="logo" id="logo">
      <div class="logo__icon" aria-hidden="true">
        <i class="fa-solid fa-heart-pulse"></i>
      </div>
      <div>
        <p class="logo__name">DigiHealth</p>
        <p class="logo__sub">Password reset</p>
      </div>
    </header>

    <div class="page-heading" id="pageHeading">
      <h1>Check your email</h1>
      <p>If an account exists for that email, a reset link has been sent.</p>
    </div>

    <div class="form__row">
      <a href="{% url 'accounts:login_page' %}" class="link--forgot">Return to login</a>
    </div>
  </section>
</div>
{% endblock %}
