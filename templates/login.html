    <form class="form" id="loginForm" method="post" action="/accounts/auth/login/" novalidate>
        {% csrf_token %}
        <div class="form__group" id="groupId">
            <label class="form__label" for="username">Username or Email</label>
            <div class="form__field">
                <i class="fa-regular fa-id-card form__icon" aria-hidden="true"></i>
                <input
                    class="form__input"
                    type="text"
                    id="username"
                    name="username"
                    placeholder="faith or faith@test.com"
                    autocomplete="username"
                    spellcheck="false"
                />
            </div>
            <p class="form__error" id="idError" role="alert"></p>
        </div>
        <div class="form__group" id="groupPw">
            <label class="form__label" for="password">Password</label>
            <div class="form__field">
                <i class="fa-solid fa-lock form__icon" aria-hidden="true"></i>
                <input
                    class="form__input"
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                />
                <button
                    type="button"
                    class="form__eye"
                    id="eyeBtn"
                    aria-label="Toggle password visibility"
                >
                    <i class="fa-regular fa-eye" id="eyeIcon" aria-hidden="true"></i>
                </button>
            </div>
            <p class="form__error" id="pwError" role="alert"></p>
        </div>
        <div class="form__row" id="formRow">
            <a href="#" class="link--forgot">Forgot password?</a>
            <a href="/accounts/register/" class="link--forgot">Create an account</a>
        </div>
        <button type="submit" class="btn" id="submitBtn">
            <span class="btn__label">Sign In</span>
            <span class="btn__arrow" aria-hidden="true">
                <i class="fa-solid fa-arrow-right"></i>
            </span>
            <span class="btn__spinner" aria-hidden="true"></span>
        </button>
    </form>
